.cl-root *{box-sizing:border-box}
.inp{width:100%;border:1.5px solid #D3E2E1;border-radius:14px;padding:12px 14px;font-size:16px;background:#fff;font-family:inherit;color:#10303A}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:13px 18px;font-weight:700;font-size:16px;font-family:inherit;border:none;cursor:pointer;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn-primary{background:#0F8B8D;color:#fff}
.btn-dark{background:#10303A;color:#fff}
.btn-soft{background:#DDEEEC;color:#0B6B6D}
.btn-danger{background:#FBE5E3;color:#B3362E}
.btn-block{width:100%}

.chip{padding:8px 14px;border-radius:999px;border:1.5px solid #D3E2E1;background:#fff;font-weight:600;font-size:14px;font-family:inherit;cursor:pointer;color:#10303A}
.chip.on{background:#10303A;color:#fff;border-color:#10303A}
.chip.dk{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.25);color:#fff}
.chip.dk.on{background:#7FE0CF;color:#10303A;border-color:#7FE0CF}
.muted{color:#5E7B82}
.iconbtn{background:none;border:none;color:#8AA3A9;padding:8px;cursor:pointer;border-radius:10px;display:inline-flex}
.iconbtn:hover{background:rgba(15,139,141,.1)}
.rowbtn{width:100%;text-align:right;background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 1px 2px rgba(16,48,58,.04),0 8px 22px -14px rgba(16,48,58,.16);border:1px solid rgba(255,255,255,.75);border-radius:18px;padding:14px 16px;cursor:pointer;font-family:inherit;color:inherit;display:flex;align-items:center;justify-content:space-between;gap:12px}
.rowbtn:active{background:rgba(244,249,248,.95)}
.nav{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 12px;background:none;border:none;font-family:inherit;font-weight:700;font-size:12px;color:#7C979D;cursor:pointer}
.nav.on{color:#0F8B8D}
.pill{padding:4px 12px;border-radius:999px;font-weight:700;font-size:13px;white-space:nowrap}
.btn:focus-visible,.chip:focus-visible,.nav:focus-visible,.rowbtn:focus-visible,.iconbtn:focus-visible{outline:3px solid #0F8B8D;outline-offset:2px}
.nav{position:relative}
.nav-badge{position:absolute;top:4px;left:calc(50% + 4px);min-width:18px;height:18px;border-radius:999px;background:#C0392B;color:#fff;font-size:11px;line-height:18px;text-align:center;padding:0 5px;font-weight:700}
select.inp{appearance:auto}

<script>
/* حارس الصور: يطلب تخزين دائم ويكتشف لو الصور اتمسحت من المتصفح */
(function(){
 var LK="clinic:photosSeen",PK="clinic:persistWarn";
 function bar(id,bg,fg,html){
  if(document.getElementById(id))return;
  var d=document.createElement("div");d.id=id;d.dir="rtl";
  d.style.cssText="position:fixed;top:0;left:0;right:0;z-index:99999;padding:12px 14px;font:600 14px/1.6 system-ui,Tahoma,sans-serif;background:"+bg+";color:"+fg+";box-shadow:0 2px 12px rgba(0,0,0,.25)";
  d.innerHTML=html;document.body.appendChild(d);return d}
 function openDb(){return new Promise(function(res,rej){
  var r=indexedDB.open("clinic-files",1);
  r.onupgradeneeded=function(){if(!r.result.objectStoreNames.contains("files"))r.result.createObjectStore("files",{keyPath:"id"})};
  r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
 function count(){return openDb().then(function(db){return new Promise(function(res,rej){
  var q=db.transaction("files","readonly").objectStore("files").count();
  q.onsuccess=function(){res(q.result)};q.onerror=function(){rej(q.error)}})})}
 function seen(){try{return +localStorage.getItem(LK)||0}catch(e){return 0}}
 function mark(n){try{localStorage.setItem(LK,String(n))}catch(e){}}
 async function check(first){
  var n;try{n=await count()}catch(e){
   if(first)bar("cx-ph-err","#B3362E","#fff","⚠ المتصفح ده مش بيسمح بتخزين الصور (ممكن وضع التصفح الخفي). افتح البرنامج من Chrome العادي.");
   return}
  var last=seen();
  if(n===0&&last>0&&first){
   var b=bar("cx-ph-lost","#B3362E","#fff","⚠ الصور اتمسحت من المتصفح (كان فيه "+last+" صورة/ملف). ده بيحصل لما المتصفح يمسح بيانات الموقع أو لو فتحت البرنامج من رابط/مكان مختلف. افتح البرنامج من نفس الرابط القديم، أو استرجع من «النسخة الكاملة». <button id=\"cx-ph-ok\" style=\"margin-inline-start:10px;padding:4px 12px;border-radius:8px;border:0;font-weight:700\">فهمت</button>");
   if(b)b.querySelector("#cx-ph-ok").onclick=function(){mark(0);b.remove()};
   return}
  if(n>0||last===0)mark(n)}
 async function persist(){
  if(!(navigator.storage&&navigator.storage.persist))return;
  var ok=false;try{ok=await navigator.storage.persisted();if(!ok)ok=await navigator.storage.persist()}catch(e){}
  if(ok)return;
  var day=new Date().toISOString().slice(0,10),w=null;try{w=localStorage.getItem(PK)}catch(e){}
  if(w===day)return;try{localStorage.setItem(PK,day)}catch(e){}
  var b=bar("cx-ph-warn","#FCEFD9","#7A4A05","ℹ المتصفح مش مأمّن تخزين الصور بشكل دائم، فممكن يمسحها. ثبّت البرنامج على الشاشة الرئيسية وخد «نسخة كاملة» كل أسبوع. <button id=\"cx-pw-ok\" style=\"margin-inline-start:10px;padding:4px 12px;border-radius:8px;border:0;font-weight:700\">تمام</button>");
  if(b)b.querySelector("#cx-pw-ok").onclick=function(){b.remove()}}
 function start(){persist();setTimeout(function(){check(true)},2500);
  setInterval(function(){check(false)},60000);
  document.addEventListener("visibilitychange",function(){if(document.hidden)check(false)})}
 if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",start);else start();
})();
</script>
</body>
